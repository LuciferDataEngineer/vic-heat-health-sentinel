name: Refresh forecast

on:
  schedule:
    # 07:30 Australian Eastern Daylight Time (UTC+11).
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Refresh the forecast and rebuild the page inputs
        run: |
          pip install -e .
          python -m vhhs.ingest --forecast-only
          python -m vhhs.pipeline
      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot data/manifest.json
          if git diff --staged --quiet; then
            echo "Forecast snapshot unchanged"
          else
            git commit -m "Refresh the Victorian heat forecast snapshot"
            git push
          fi
